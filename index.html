<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>南岗瑶寨数字文旅地图</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: "微软雅黑"}
        body {background:#f7f5f0;}
        /*导航按钮区*/
        .nav-box{
            width:100%;
            padding:20px;
            display:flex;
            gap:20px;
            justify-content:center;
            background:#6b3828;
        }
        .nav-btn{
            padding:12px 26px;
            border:none;
            background:#e6a23c;
            color:#fff;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
        }
        .nav-btn:hover{background:#d49330;}
        /*页面容器，默认只显示首页*/
        .page{
            width:95%;
            max-width:1200px;
            margin:30px auto;
            display:none;
            min-height:600px;
            background:#fff;
            padding:30px;
            border-radius:8px;
            box-shadow:0 2px 12px #0000001a;
        }
        #page-index{display:block;}
        h2{color:#6b3828;margin-bottom:25px;border-left:5px solid #e6a23c;padding-left:10px;}
        /*地图点位*/
        .map-box{
            width:100%;
            height:520px;
            border:2px solid #ccc;
            position:relative;
            background:#faf8f3;
        }
        .map-point{
            width:24px;height:24px;
            background:#c83c3c;
            border-radius:50%;
            position:absolute;
            cursor:pointer;
        }
        /*点位坐标*/
        .p1{top:15%;left:22%}
        .p2{top:38%;left:55%}
        .p3{top:62%;left:32%}
        .p4{top:75%;left:68%}
        /*弹窗*/
        .modal{
            width:420px;
            background:#fff;
            border:1px solid #ddd;
            padding:20px;
            position:fixed;
            top:50%;left:50%;
            transform:translate(-50%,-50%);
            display:none;
            z-index:99;
            border-radius:8px;
        }
        .close-modal{
            float:right;
            border:none;
            background:#999;
            color:#fff;
            padding:4px 9px;
            cursor:pointer;
        }
        /*文创商品布局*/
        .goods-wrap{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:25px;
        }
        .goods-item{
            border:1px solid #eee;
            padding:15px;
            border-radius:6px;
        }
    </style>
</head>
<body>
<!--顶部导航-->
<div class="nav-box">
    <button class="nav-btn" onclick="showPage('page-index')">首页</button>
    <button class="nav-btn" onclick="showPage('page-map')">体验地图</button>
    <button class="nav-btn" onclick="showPage('page-goods')">非遗好物</button>
</div>

<!--首页页面-->
<div id="page-index" class="page">
    <h2>数字瑶脉·南岗瑶族非遗数字化项目</h2>
    <p style="line-height:2;font-size:16px;">
        本页面为南岗瑶寨文旅数字交互原型，上方按钮可切换页面。<br>
        1、【体验地图页】：下方红点可点击弹窗查看点位体验内容<br>
        2、【非遗好物页】：展示当地瑶族文创与农特产品
    </p>
</div>

<!--地图页面-->
<div id="page-map" class="page">
    <h2>南岗瑶寨文旅点位示意图（下方红点可点击）</h2>
    <div class="map-box">
        <div class="map-point p1" onclick="openModal('吊脚楼古民居','参观瑶族传统木构民居，体验瑶家生活起居、手工刺绣观摩')"></div>
        <div class="map-point p2" onclick="openModal('歌堂坪展演场','观赏瑶族长鼓舞、瑶歌对唱，参与民俗篝火互动')"></div>
        <div class="map-point p3" onclick="openModal('非遗刺绣工坊','跟着非遗传承人学习简易瑶绣，选购手工绣品')"></div>
        <div class="map-point p4" onclick="openModal('瑶家美食坊','品尝瑶家腊肉、油茶、竹筒饭等特色乡土美食')"></div>
    </div>
    <p style="margin-top:15px;color:#666;">点击任意红点弹出介绍，可查看点位游玩项目</p>
</div>

<!--文创好物页面-->
<div id="page-goods" class="page">
    <h2>瑶族非遗文创·乡土好物</h2>
    <div class="goods-wrap">
        <div class="goods-item">
            <h4>瑶绣纹样帆布包</h4>
            <p>非遗纹样原创、日常通勤文创</p>
        </div>
        <div class="goods-item">
            <h4>高山云雾瑶山茶</h4>
            <p>本土茶园手工炒制</p>
        </div>
        <div class="goods-item">
            <h4>丝苗米礼盒</h4>
            <p>南岗村特色农产伴手礼</p>
        </div>
        <div class="goods-item">
            <h4>瑶族IP钥匙扣</h4>
            <p>卡通非遗形象小文创</p>
        </div>
        <div class="goods-item">
            <h4>瑶寨风景明信片</h4>
            <p>村寨实拍文创纪念品</p>
        </div>
        <div class="goods-item">
            <h4>竹筒酒伴手礼</h4>
            <p>瑶族传统酿造特产</p>
        </div>
    </div>
</div>

<!--弹窗模块-->
<div class="modal" id="modal">
    <button class="close-modal" onclick="closeModal()">关闭</button>
    <h3 id="modal-title"></h3>
    <p id="modal-text" style="margin-top:12px;line-height:1.8;"></p>
</div>

<script>
//切换页面
function showPage(pageId){
    //全部页面隐藏
    document.querySelectorAll('.page').forEach(item=>{
        item.style.display='none'
    })
    //选中页面显示
    document.getElementById(pageId).style.display='block'
}
//打开弹窗
function openModal(title,text){
    document.getElementById('modal-title').innerText=title
    document.getElementById('modal-text').innerText=text
    document.getElementById('modal').style.display='block'
}
//关闭弹窗
function closeModal(){
    document.getElementById('modal').style.display='none'
}
</script>
</body>
</html>
