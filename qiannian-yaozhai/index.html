<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>瑶寨文化展示</title>
  <link rel="preload" as="image" href="assets/village-cover.webp" fetchpriority="high">
  <style>
    :root {
      --paper: #f7f4ee;
      --paper-soft: #fbf9f3;
      --surface: #fffdf8;
      --surface-2: #f3efe4;
      --ink: #20261f;
      --muted: #6c7468;
      --line: rgba(48, 59, 44, 0.12);
      --shadow: 0 14px 34px rgba(34, 42, 29, 0.1);
      --hero-shadow: 0 20px 40px rgba(16, 25, 35, 0.16);
      --title-font: "STKaiti", "华文楷体", "Kaiti SC", "KaiTi", "楷体", serif;

      --drum: #C0723C;
      --drum-soft: #f5e6dc;
      --dye: #1A3A5C;
      --dye-soft: #e3ebf4;
      --embroider: #C23B22;
      --embroider-soft: #f6e3dd;
      --dance: #8B5A2B;
      --dance-soft: #f3e5d3;
      --life: #D4A017;
      --life-soft: #FBF2D9;
      --village: #6C8A43;
      --village-soft: #e8f0da;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
    }

    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: rgba(20, 24, 26, 0.78);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-inner {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 14px 16px 12px;
      scrollbar-width: none;
      max-width: 430px;
      margin: 0 auto;
    }

    .nav-inner::-webkit-scrollbar {
      display: none;
    }

    .nav-link {
      position: relative;
      flex: 0 0 auto;
      color: rgba(255, 250, 243, 0.8);
      font-size: 14px;
      font-weight: 500;
      font-family: var(--title-font);
      letter-spacing: 0.02em;
      padding-bottom: 8px;
      text-decoration: none;
    }

    .nav-link.active {
      color: #fff;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      border-radius: 999px;
      background: var(--nav-accent, #fff);
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #fbf9f4 0%, #f7f4ee 20%, #f3efe4 100%);
      box-shadow: 0 0 0 1px rgba(70, 80, 67, 0.03);
      position: relative;
    }

    .view {
      display: none;
      min-height: 100vh;
      padding: 68px 16px 28px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .view.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    #detail-view.theme-village {
      background:
        linear-gradient(180deg, rgba(247, 244, 238, 0.98) 0%, rgba(247, 244, 238, 0.98) 58%, rgba(247, 244, 238, 0.88) 74%, rgba(247, 244, 238, 0.38) 100%),
        url("assets/village-panorama.webp") center bottom / cover no-repeat;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-head h2,
    .section-head p,
    .hero-copy h1,
    .hero-copy p,
    .summary-strip p,
    .feature-card h3,
    .feature-card p,
    .topic-panel h3,
    .topic-panel p,
    .detail-top h1,
    .detail-top p,
    .detail-card h3,
    .detail-card p,
    .need-block h3,
    .need-block p,
    .aside-card h3,
    .aside-card p {
      margin: 0;
    }

    .section-head h2 {
      font-size: 20px;
      line-height: 1.2;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .section-head p {
      font-size: 13px;
      color: var(--muted);
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 250px;
      border-radius: 26px;
      padding: 22px;
      margin-bottom: 18px;
      background:
        linear-gradient(180deg, rgba(10, 23, 36, 0.24), rgba(10, 23, 36, 0.72)),
        radial-gradient(circle at 72% 24%, rgba(255, 255, 255, 0.12), transparent 20%),
        url("assets/village-cover.webp") center / cover no-repeat,
        linear-gradient(160deg, #11273f 0%, #1A3A5C 38%, #284f74 100%);
      color: #f6f7fb;
      box-shadow: var(--hero-shadow);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto -10% -22% -10%;
      height: 54%;
      background:
        radial-gradient(circle at 18% 70%, rgba(255, 255, 255, 0.1), transparent 24%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
      opacity: 0.8;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -2%;
      top: 12%;
      width: 42%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 70%);
      filter: blur(4px);
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
      max-width: 72%;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 12px;
      font-family: var(--title-font);
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .hero-copy h1 {
      font-size: 30px;
      line-height: 1.15;
      font-family: var(--title-font);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .hero-title {
      display: block;
      width: auto;
      margin: 0;
      font-family: var(--title-font);
      font-size: 34px;
      letter-spacing: 4px;
      line-height: 1.25;
      color: #1f3a2e;
      text-shadow: 0 6px 14px rgba(12, 18, 20, 0.12);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hero-copy p {
      font-size: 14px;
      line-height: 1.75;
      color: rgba(246, 247, 251, 0.86);
    }

    .hero-tag-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-tag {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      font-size: 12px;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .summary-strip {
      display: grid;
      gap: 10px;
      padding: 16px 18px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .summary-strip strong {
      font-size: 16px;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .summary-strip p {
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .feature-card {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: left;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .feature-card:active {
      transform: scale(0.985);
    }

    .feature-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(34, 42, 29, 0.12);
    }

    .feature-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--theme);
      opacity: 0.95;
    }

    .feature-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .feature-emoji {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--soft);
      font-size: 22px;
    }

    .feature-index {
      font-size: 12px;
      color: var(--muted);
    }

    .feature-card h3 {
      font-size: 17px;
      line-height: 1.25;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .feature-card p {
      font-size: 13px;
      line-height: 1.72;
      color: var(--muted);
    }

    .feature-thumb {
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--theme) 22%, white), color-mix(in srgb, var(--theme) 8%, white)),
        var(--soft);
      position: relative;
      overflow: hidden;
    }

    .feature-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .feature-thumb img.fit-contain,
    .detail-placeholder img.fit-contain {
      object-fit: contain;
      background: color-mix(in srgb, var(--theme) 8%, #f7f4ee);
    }

    .feature-thumb.has-image::before,
    .feature-thumb.has-image::after {
      display: none;
    }

    .feature-thumb::before,
    .feature-thumb::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      opacity: 0.46;
    }

    .feature-thumb::before {
      inset: auto -8% -22% 12%;
      height: 62%;
      background: color-mix(in srgb, var(--theme) 16%, white);
    }

    .feature-thumb::after {
      width: 30%;
      aspect-ratio: 1;
      right: 10%;
      top: 20%;
      background: color-mix(in srgb, var(--theme) 26%, white);
      filter: blur(2px);
    }

    .topic-stack {
      display: grid;
      gap: 14px;
    }

    .topic-panel {
      display: grid;
      gap: 10px;
      padding: 16px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .topic-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .topic-pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .topic-pill {
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--ink);
      font-size: 12px;
    }

    .topic-panel h3 {
      font-size: 17px;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .topic-panel p {
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
    }

    .detail-top {
      display: grid;
      gap: 14px;
      margin-bottom: 16px;
    }

    .back-button {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-family: var(--title-font);
      font-weight: 700;
    }

    .detail-top h1 {
      font-size: 28px;
      line-height: 1.15;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .detail-top p {
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }

    .detail-cover {
      position: relative;
      overflow: hidden;
      min-height: 210px;
      border-radius: 24px;
      margin-bottom: 18px;
      background: linear-gradient(160deg, var(--theme) 0%, color-mix(in srgb, var(--theme) 72%, white) 100%);
      box-shadow: var(--hero-shadow);
      color: #fff;
    }

    .detail-cover-media {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 220ms ease;
    }

    .detail-cover.has-image .detail-cover-media {
      opacity: 0.64;
    }

    .detail-cover.media-focus .detail-cover-media {
      opacity: 0.98;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .detail-cover.full-bleed .detail-cover-media {
      opacity: 0.98;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .detail-cover::before {
      content: "";
      position: absolute;
      inset: auto -8% -16% -8%;
      height: 48%;
      background:
        radial-gradient(circle at 20% 40%, rgba(255, 255, 255, 0.16), transparent 20%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0));
    }

    .detail-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 18, 26, 0.18), rgba(10, 18, 26, 0.56));
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .detail-cover.has-image::after {
      opacity: 1;
    }

    .detail-cover.media-focus::after {
      opacity: 0;
    }

    .detail-cover.full-bleed::after {
      opacity: 0;
    }

    .detail-cover.media-focus::before {
      opacity: 0.18;
    }

    .detail-cover.media-focus .detail-cover-copy {
      display: none;
    }

    .detail-cover.full-bleed .detail-cover-copy {
      display: none;
    }

    .detail-cover-copy {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
      padding: 22px;
      min-height: 210px;
      align-content: end;
    }

    .detail-cover-badge {
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 12px;
      font-family: var(--title-font);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .detail-cover-title {
      font-size: 30px;
      line-height: 1.1;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .detail-cover-text {
      max-width: 76%;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.86);
    }

    .detail-meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .meta-chip {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--theme);
      font-size: 12px;
      font-family: var(--title-font);
      font-weight: 600;
    }

    .detail-list {
      display: grid;
      gap: 14px;
      margin-bottom: 18px;
    }

    .detail-card {
      display: grid;
      gap: 10px;
      padding: 16px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .detail-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-index {
      color: var(--theme);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .detail-card h3 {
      font-size: 18px;
      line-height: 1.25;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .detail-card p {
      font-size: 14px;
      line-height: 1.82;
      color: var(--muted);
    }

    .detail-placeholder {
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--theme) 20%, white), color-mix(in srgb, var(--theme) 8%, white)),
        var(--soft);
      position: relative;
      overflow: hidden;
    }

    .detail-placeholder img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .detail-placeholder img.rotate-90 {
      object-fit: contain;
      transform: rotate(180deg) scale(1.02);
      transform-origin: center;
      background: color-mix(in srgb, var(--theme) 8%, #f7f4ee);
    }

    .detail-placeholder.has-image::before {
      display: none;
    }

    .detail-placeholder::before {
      content: "";
      position: absolute;
      inset: auto 10% -18% -6%;
      height: 56%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.32);
    }

    .need-block,
    .aside-card {
      display: grid;
      gap: 10px;
      padding: 16px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .need-block h3,
    .aside-card h3 {
      font-size: 17px;
      font-family: var(--title-font);
      font-weight: 700;
    }

    .need-block p,
    .aside-card p {
      font-size: 13px;
      line-height: 1.78;
      color: var(--muted);
    }

    .need-list,
    .aside-list {
      display: grid;
      gap: 10px;
    }

    .need-item,
    .aside-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.72;
      color: var(--muted);
    }

    .need-bullet,
    .aside-bullet {
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: var(--theme);
      font-size: 12px;
      font-weight: 700;
    }

    .bottom-gap {
      height: 12px;
    }

    .transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
      background: transparent;
    }

    .transition-overlay.active {
      opacity: 1;
    }

    .transition-overlay canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (min-width: 431px) {
      body {
        background:
          linear-gradient(180deg, #f5f0e6 0%, #f1ede2 100%);
      }

      .app-shell {
        margin: 0 auto;
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="主导航">
    <div class="nav-inner">
      <a class="nav-link active" href="#home" data-target="home">首页</a>
      <a class="nav-link" href="#village" data-target="village">千年瑶寨</a>
      <a class="nav-link" href="#drum" data-target="drum">瑶族手鼓</a>
      <a class="nav-link" href="#dye" data-target="dye">扎染</a>
      <a class="nav-link" href="#embroider" data-target="embroider">瑶绣</a>
      <a class="nav-link" href="#dance" data-target="dance">长鼓舞</a>
      <a class="nav-link" href="#life" data-target="life">当地特色</a>
    </div>
  </nav>

  <div class="app-shell">
    <main class="view active" id="home-view" aria-labelledby="home-title">
      <section class="hero">
        <div class="hero-copy">
          <div class="hero-kicker">南岗千年瑶寨</div>
          <h1 id="home-title" class="hero-title">千年瑶寨</h1>
          <p>以真实移动端页面方式梳理瑶寨里最值得展开的几条内容线：器乐、染织、舞蹈与特色风物。</p>
          <div class="hero-tag-row">
            <span class="hero-tag">手鼓节奏</span>
            <span class="hero-tag">蓝靛纹样</span>
            <span class="hero-tag">长鼓舞步</span>
            <span class="hero-tag">瑶山风物</span>
          </div>
        </div>
      </section>

      <section class="summary-strip">
        <strong>Hello，瑶寨你好</strong>
        <p>从村寨风貌出发，继续走进手鼓、扎染、瑶绣、长鼓舞与当地特色，顺着不同线索看见瑶族文化的生活肌理。</p>
      </section>

      <section>
        <div class="section-head">
          <h2>文化模块</h2>
          <p>5 条内容线 + 1 个村寨总览</p>
        </div>
        <div class="feature-grid" id="feature-grid"></div>
      </section>

      <div class="bottom-gap"></div>
    </main>

    <main class="view" id="detail-view" aria-live="polite">
      <section class="detail-top">
        <button class="back-button" id="back-home" type="button">← 返回首页</button>
        <h1 id="detail-title"></h1>
        <p id="detail-summary"></p>
      </section>

      <section class="detail-cover" id="detail-cover">
        <div class="detail-cover-media" id="detail-cover-media" aria-hidden="true"></div>
        <div class="detail-cover-copy">

        soft: '#f6e3dd',
        image: 'assets/embroider-hat.webp'
      },
      {
        id: 'dance',
        title: '长鼓舞',
        summary: '国家级非遗项目，在节庆与歌堂场合中最能展现瑶寨气势。',
        emoji: '✨',
        color: '#8B5A2B',
        soft: '#f3e5d3',
        image: 'assets/dance-cover.webp'
      },
      {
        id: 'life',
        title: '当地特色',
        summary: '从米面粮油到草本洗护，瑶山田埂孕育出的特色风物一览。',
        emoji: '🛍️',
        color: '#D4A017',
        soft: '#FBF2D9',
        image: 'assets/specialty-grape.webp'
      }
    ];

    const navLinks = [...document.querySelectorAll('.nav-link')];
    const featureGrid = document.getElementById('feature-grid');
    const homeView = document.getElementById('home-view');
    const detailView = document.getElementById('detail-view');
    const detailTitle = document.getElementById('detail-title');
    const detailSummary = document.getElementById('detail-summary');
    const detailCover = document.getElementById('detail-cover');
    const detailCoverMedia = document.getElementById('detail-cover-media');
    const detailBadge = document.getElementById('detail-badge');
    const detailCoverTitle = document.getElementById('detail-cover-title');
    const detailCoverText = document.getElementById('detail-cover-text');
    const detailMetaRow = document.getElementById('detail-meta-row');
    const detailList = document.getElementById('detail-list');
    const overlay = document.getElementById('transition-overlay');
    const canvas = document.getElementById('transition-canvas');
    const ctx = canvas.getContext('2d');

    let activePage = 'home';
    let isTransitioning = false;

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    window.addEventListener('resize', () => { if (isTransitioning) resizeCanvas(); });


    let imageObserver;
    function loadVisibleImages(root) {
      imageObserver?.disconnect();
      const images = root.querySelectorAll('img[data-src]');
      const load = (img) => { img.src = img.dataset.src; img.removeAttribute('data-src'); };
      if (!('IntersectionObserver' in window)) { images.forEach(load); return; }
      imageObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) { load(entry.target); imageObserver.unobserve(entry.target); }
        });
      }, { rootMargin: '120px 0px' });
      images.forEach((img) => imageObserver.observe(img));
    }

    function renderHome() {
      featureGrid.innerHTML = homeModules.map((item, index) => `
        <button
          class="feature-card"
          type="button"
          data-target="${item.id}"
          ${item.disabled ? 'data-disabled="true"' : ''}
          style="--theme:${item.color}; --soft:${item.soft};"
        >
          <div class="feature-top">
            <div class="feature-emoji">${item.emoji}</div>
            <div class="feature-index">${String(index + 1).padStart(2, '0')}</div>
          </div>
          <div class="feature-thumb ${item.image ? 'has-image' : ''}" aria-hidden="true">
            ${item.image ? `<img class="${item.imageClass || ''}" data-src="${item.image.replace(/\.webp$/, '-thumb.webp')}" alt="" decoding="async">` : ''}
          </div>
          <h3>${item.title}</h3>
          ${item.summary ? `<p>${item.summary}</p>` : ''}
        </button>
      `).join('');

      featureGrid.querySelectorAll('.feature-card').forEach((card) => {
        card.addEventListener('click', (event) => {
          const id = card.dataset.target;
          if (card.dataset.disabled === 'true') {
            return;
          }
          openDetail(id, card, event);
        });
      });
    }

    function renderDetail(id) {
      const data = detailData[id];
      if (!data) {
        return;
      }

      detailView.style.setProperty('--theme', data.color);
      detailView.style.setProperty('--soft', data.soft);
      detailTitle.textContent = data.title;
      detailSummary.textContent = data.summary;
      detailBadge.textContent = data.badge;
      detailCoverTitle.textContent = data.title;
      detailCoverText.textContent = data.coverText;
      detailCover.classList.toggle('has-image', Boolean(data.coverImage));
      detailCover.classList.toggle('media-focus', data.coverMode === 'image-priority');
      detailCover.classList.toggle('full-bleed', data.coverMode === 'full-bleed');
      detailCoverMedia.style.backgroundImage = data.coverImage ? `url("${data.coverImage}")` : 'none';
      detailView.classList.toggle('theme-village', id === 'village');
      detailSummary.style.display = data.summary ? '' : 'none';
      detailBadge.style.display = data.badge ? '' : 'none';
      detailCoverText.style.display = data.coverText ? '' : 'none';

      detailMetaRow.innerHTML = data.meta.filter(Boolean).map((tag) => `
        <span class="meta-chip">${tag}</span>
      `).join('');

      detailList.innerHTML = data.cards.map((card, index) => {
        const fallbackImage = id === 'dye' && index === 0 ? data.coverImage : '';
        const cardImage = card.image || fallbackImage;
        const cardAlt = card.alt || card.title || data.title;
        const cardImageClass = card.imageClass || '';

        return `
        <article class="detail-card">
          <div class="detail-card-head">
            <span class="detail-index">0${index + 1}</span>
            ${data.badge ? `<span class="meta-chip">${data.badge}</span>` : ''}
          </div>
          <div class="detail-placeholder ${cardImage ? 'has-image' : ''}" aria-hidden="true">
            ${cardImage ? `<img class="${cardImageClass}" data-src="${cardImage}" alt="${cardAlt}" decoding="async">` : ''}
          </div>
          ${card.title ? `<h3>${card.title}</h3>` : ''}
          ${card.text ? `<p>${card.text}</p>` : ''}
        </article>
      `;
      }).join('');
    }

    function updateNav(page) {
      navLinks.forEach((link) => {
        const target = link.dataset.target;
        const data = detailData[target];
        const isActive = target === page || (page === 'home' && target === 'home');
        link.classList.toggle('active', isActive);
        const accent = data?.color || '#ffffff';
        if (isActive) {
          link.style.setProperty('--nav-accent', accent);
        } else {
          link.style.removeProperty('--nav-accent');
        }
      });
    }

    function switchView(page) {
      const isHome = page === 'home';
      homeView.classList.toggle('active', isHome);
      detailView.classList.toggle('active', !isHome);
      activePage = page;
      loadVisibleImages(isHome ? homeView : detailView);
      updateNav(page);
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function drawSolidBurstFrame(progress, x, y, color) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const maxRadius = Math.hypot(Math.max(x, width - x), Math.max(y, height - y)) + 56;
      const radius = maxRadius * (1 - Math.pow(1 - progress, 2.2));
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(radius, 0.01), 0, Math.PI * 2);
      ctx.fill();
    }

    function runTransition({ x, y, color, onMidpoint, onComplete }) {
      if (isTransitioning) {
        return;
      }
      resizeCanvas();
      isTransitioning = true;
      overlay.classList.add('active');
      overlay.style.background = 'transparent';
      const duration = 620;
      const start = performance.now();
      let midpointDone = false;

      function frame(now) {
        const raw = Math.min((now - start) / duration, 1);
        const burstPhase = Math.min(raw / 0.62, 1);
        const fadePhase = raw <= 0.62 ? 1 : 1 - ((raw - 0.62) / 0.38);
        drawSolidBurstFrame(burstPhase, x, y, color);
        overlay.style.opacity = String(Math.max(0, Math.min(1, fadePhase)));

        if (raw >= 0.46 && !midpointDone) {
          midpointDone = true;
          onMidpoint?.();
        }

        if (raw < 1) {
          requestAnimationFrame(frame);
          return;
        }

        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        overlay.classList.remove('active');
        overlay.style.background = 'transparent';
        overlay.style.opacity = '';
        isTransitioning = false;
        onComplete?.();
      }

      requestAnimationFrame(frame);
    }

    function openDetail(id, trigger, event) {
      const data = detailData[id];
      if (!data || isTransitioning) {
        return;
      }
      const rect = trigger.getBoundingClientRect();
      const x = event?.clientX ?? rect.left + rect.width / 2;
      const y = event?.clientY ?? rect.top + rect.height / 2;
      runTransition({
        x,
        y,
        color: data.color,
        onMidpoint: () => {
          renderDetail(id);
          switchView(id);
          history.replaceState(null, '', `#${id}`);
        }
      });
    }

    function openHome(trigger, color) {
      if (isTransitioning) {
        return;
      }
      const rect = trigger?.getBoundingClientRect?.() || { left: window.innerWidth / 2, top: 88, width: 0, height: 0 };
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      runTransition({
        x,
        y,
        color: color || (detailData[activePage]?.color || '#6C8A43'),
        onMidpoint: () => {
          switchView('home');
          history.replaceState(null, '', '#home');
        }
      });
    }

    document.getElementById('back-home').addEventListener('click', (event) => {
      openHome(event.currentTarget, detailData[activePage]?.color);
    });

    navLinks.forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        const target = link.dataset.target;
        if (target === activePage) {
          return;
        }
        if (target === 'home') {
          openHome(link, detailData[activePage]?.color);
          return;
        }
        const data = detailData[target];
        if (!data) {
          return;
        }
        openDetail(target, link, event);
      });
    });

    renderHome();

    const initialHash = window.location.hash.replace('#', '');
    if (detailData[initialHash]) {
      renderDetail(initialHash);
      switchView(initialHash);
    } else {
      switchView('home');
      history.replaceState(null, '', '#home');
    }
  </script>
</body>
</html>
